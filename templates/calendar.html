{% extends "layout.html" %}
{% block title %}
    Calendar
{% endblock %}
{% block page_class %}
    calendar-bg
{% endblock %}
{% block main %}
<div class="calendar-page">
    <div class="calendar-header">
        <h1>Calendar</h1>
    </div>
    <div class="calendar">
        <div class="calendar-top">
            <button type="button" id="previous-month">&lt;</button>
            <h2 id="month-year"></h2>
            <button type="button" id="next-month">&gt;</button>
        </div>
        <div class="calendar-weekdays">
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
            <div>Sun</div>
        </div>
        <div class="calendar-days" id="calendar-days"></div>
    </div>
</div>
<script>
    const tasks = [
        {% for task in tasks %}
            "{{ task.due_date }}"{% if not loop.last %},{% endif %}
        {% endfor %}
    ];
    const taskDates = new Set(tasks);
    const calendarDays = document.getElementById("calendar-days");
    const monthYear = document.getElementById("month-year");
    const previousMonth = document.getElementById("previous-month");
    const nextMonth = document.getElementById("next-month");
    let currentDate = new Date();
    function renderCalendar() {
        calendarDays.innerHTML = "";
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        let startingDay = firstDay.getDay();
        startingDay = startingDay === 0 ? 6 : startingDay - 1;
        const daysInMonth = lastDay.getDate();
        monthYear.textContent = currentDate.toLocaleDateString("en-US", {
            month: "long",
            year: "numeric"
        });
        for (let i = 0; i < startingDay; i++) {
            const emptyDay = document.createElement("div");
            emptyDay.classList.add("calendar-day", "empty");
            calendarDays.appendChild(emptyDay);
        }
        for (let day = 1; day <= daysInMonth; day++) {
            const dayElement = document.createElement("div");
            dayElement.classList.add("calendar-day");
            dayElement.textContent = day;
            const monthNumber = String(month + 1).padStart(2, "0");
            const dayNumber = String(day).padStart(2, "0");
            const dateString = `${year}-${monthNumber}-${dayNumber}`;
            const today = new Date();
            const isToday =
                day === today.getDate() &&
                month === today.getMonth() &&
                year === today.getFullYear();
            const hasTask = taskDates.has(dateString);
            if (isToday && hasTask) {
                dayElement.classList.add("today-task");
            }
            else if (isToday) {
                dayElement.classList.add("today");
            }
            else if (hasTask) {
                dayElement.classList.add("has-task");
            }
            calendarDays.appendChild(dayElement);
        }
    }
    previousMonth.addEventListener("click", function () {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
    });
    nextMonth.addEventListener("click", function () {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
    });
    renderCalendar();
</script>
{% endblock %}
